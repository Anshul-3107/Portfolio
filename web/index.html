<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Anshul of AI — Grandmaster Witcher of the Neural School. Portfolio of Anshul Arohi, AI/ML Engineer & Systems Developer.">
  <meta name="theme-color" content="#0d0e11">

  <!-- Open Graph -->
  <meta property="og:title" content="Anshul of AI | Grandmaster Witcher Portfolio">
  <meta property="og:description" content="AI/ML Engineer, Python Developer, AWS Certified Machine Learning Engineer. Explore contracts, neural signs, and lore.">
  <meta property="og:type" content="website">

  <!-- Fonts Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;600;700;800&family=Marcellus&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <title>Anshul of AI • Grandmaster Witcher Portfolio</title>

  <style>
    body {
      background-color: #0d0e11;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Cinzel', serif;
      user-select: none;
      -webkit-user-select: none;
    }

    #loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #1b1c22 0%, #0d0e11 75%);
      z-index: 9999;
      transition: opacity 0.8s ease-out;
    }

    .medallion-pulse {
      width: 72px;
      height: 72px;
      position: relative;
      margin-bottom: 24px;
      animation: pulseGlow 2.5s infinite ease-in-out;
    }

    .witcher-logo-title {
      color: #c5a059;
      font-size: 20px;
      letter-spacing: 4px;
      text-transform: uppercase;
      font-weight: 700;
      text-shadow: 0 0 12px rgba(197, 160, 89, 0.4);
      margin-bottom: 8px;
    }

    .witcher-logo-subtitle {
      color: #8c887b;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .load-bar {
      width: 180px;
      height: 2px;
      background: rgba(197, 160, 89, 0.2);
      margin-top: 24px;
      position: relative;
      overflow: hidden;
    }

    .load-progress {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, transparent, #c5a059, transparent);
      animation: shimmer 1.8s infinite;
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 8px rgba(197, 160, 89, 0.3)); }
      50% { transform: scale(1.05); filter: drop-shadow(0 0 20px rgba(197, 160, 89, 0.7)); }
    }

    @keyframes shimmer {
      0% { left: -40%; }
      100% { left: 100%; }
    }
  </style>

  <!-- Self-contained Web Audio Synthesizer for Witcher Sound Effects -->
  <script>
    (function() {
      let audioCtx = null;
      let soundEnabled = true;

      function getAudioContext() {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            audioCtx = new AudioContextClass();
          }
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        return audioCtx;
      }

      window.setWitcherAudioEnabled = function(enabled) {
        soundEnabled = !!enabled;
      };

      window.isWitcherAudioEnabled = function() {
        return soundEnabled;
      };

      window.playWitcherAudio = function(type) {
        if (!soundEnabled) return;
        try {
          const ctx = getAudioContext();
          if (!ctx) return;
          const now = ctx.currentTime;

          if (type === 'tab') {
            // Resonant parchment / menu swoosh
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            const filter = ctx.createBiquadFilter();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(220, now);
            osc.frequency.exponentialRampToValueAtTime(110, now + 0.18);

            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(1200, now);
            filter.frequency.exponentialRampToValueAtTime(300, now + 0.18);

            gain.gain.setValueAtTime(0.08, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);

            osc.connect(filter);
            filter.connect(gain);
            gain.connect(ctx.destination);

            osc.start(now);
            osc.stop(now + 0.2);
          } else if (type === 'click') {
            // Crisp sword sheen / metallic clink
            const osc = ctx.createOscillator();
            const osc2 = ctx.createOscillator();
            const gain = ctx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(1400, now);
            osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);

            osc2.type = 'triangle';
            osc2.frequency.setValueAtTime(2800, now);
            osc2.frequency.exponentialRampToValueAtTime(600, now + 0.08);

            gain.gain.setValueAtTime(0.06, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

            osc.connect(gain);
            osc2.connect(gain);
            gain.connect(ctx.destination);

            osc.start(now);
            osc2.start(now);
            osc.stop(now + 0.12);
            osc2.stop(now + 0.12);
          } else if (type === 'hover') {
            // Soft rune chime ping
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(587.33, now); // D5 note
            osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.06); // E5 note

            gain.gain.setValueAtTime(0.025, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.08);

            osc.connect(gain);
            gain.connect(ctx.destination);

            osc.start(now);
            osc.stop(now + 0.08);
          } else if (type === 'seal') {
            // Low thudding wax seal press
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(45, now + 0.25);

            gain.gain.setValueAtTime(0.12, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

            osc.connect(gain);
            gain.connect(ctx.destination);

            osc.start(now);
            osc.stop(now + 0.3);
          } else if (type === 'sign') {
            // Magic sign casting hum (Igni / Aard / Quen)
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(130, now);
            osc.frequency.linearRampToValueAtTime(260, now + 0.15);
            osc.frequency.exponentialRampToValueAtTime(65, now + 0.35);

            gain.gain.setValueAtTime(0.04, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.38);

            osc.connect(gain);
            gain.connect(ctx.destination);

            osc.start(now);
            osc.stop(now + 0.38);
          }
        } catch (e) {
          // Audio autoplay block or unsupported - gracefully continue
        }
      };

      window.downloadWitcherResume = function() {
        function triggerDownload(url, filename) {
          try {
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.target = '_blank';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
          } catch (e) {
            window.open(url, '_blank');
          }
        }

        // 1. Download Resume
        triggerDownload('Anshul_Arohi_Resume.pdf', 'Anshul_Arohi_Resume.pdf');

        // 2. Download AWS Certified ML Engineer Certificate
        setTimeout(function() {
          triggerDownload('AWS_Certified_Machine_Learning_Engineer_Associate.pdf', 'AWS_Certified_Machine_Learning_Engineer_Associate.pdf');
        }, 220);
      };

      window.toggleWitcherFullscreen = function() {
        if (!document.fullscreenElement) {
          if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen().catch(() => {});
          } else if (document.documentElement.webkitRequestFullscreen) {
            document.documentElement.webkitRequestFullscreen();
          }
          return true;
        } else {
          if (document.exitFullscreen) {
            document.exitFullscreen().catch(() => {});
          } else if (document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
          }
          return false;
        }
      };

      window.isWitcherFullscreen = function() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement);
      };

      window.hideWitcherLoader = function() {
        const loader = document.getElementById('loading-container');
        if (loader) {
          loader.style.opacity = '0';
          setTimeout(() => {
            loader.style.display = 'none';
          }, 800);
        }
      };
    })();
  </script>
